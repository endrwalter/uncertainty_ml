[general]
; y label for this specific analysis, this label should be a column in the X.csv file present in analysis/Data/1_preprocessed_data
y_label =   label
; other col to drop. note that the current motor symptom at bl is always dropped - do not include it here
col_to_drop = months_to_conversion
; perform feature selection using stat-test: True/False
include_feature_selector = False 
; how many features do you want to include?
n_of_features = 17 (not used if include_feature_selector is False)
; path to folder that contains csv of feature types (one csv list per type)
path_to_feature_types = ../data/adni/feature_list_types
; list of model to test (atm only: randomforestclassifier extratreesclassifier xgbclassifier logisticregression svc voting stacking tabpfn)
classifiers_list = randomforestclassifier extratreesclassifier xgbclassifier logisticregression svc
; shap analysis (True or False)
shap_analysis = False
; permutation importance analysis (True or False)
perm_importance = False
; path to input files
input_path = ../data/adni/adni_baseline_only_36m.csv
; path for output
output_path = ../results/classification/mci_ad_conversion/
; drop random patients (True or False) - 
drop_random_patients = False
; drop info at baseline (other than dyskinesia)
drop_bl_info = False
; use calibration (True or False)
use_calibration = True
; use group split (True or False) - adni case: we want to split patients, not visits, but the index is (patient, visit)
use_group_split = True
; group column for splitting if use_group_split is True. In ADNI, the index is a MultiIndex of (patient_id, month), so we specify both levels here. The code will handle extracting the patient_id level for grouping.
group_column = subject_id month

[gridsearch params]
n_jobs = 30
; refit strategy for each randomized grid search cv
refit = auprc 
; number of repeated cross validations
cv_repeats = 5
; cross validation number of folds
cv_splits = 3
; randomized grid search cv number of iterations
n_iter = 20
; proportion of test/train data
train_test_split_size = 0.2
; how to handle imbalanced data: choose among all, SMOTE, UnderSampling, no
handle_imb_data = no
; number of overall iteration with differently generated train test splits (using different seed in train_test_split function)
nested_iterations = 30

