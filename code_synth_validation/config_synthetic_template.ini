[general]
; y label — left empty because y.csv lives alongside X.csv
; the pipeline will find it automatically
y_label =
; no columns to drop in synthetic data
col_to_drop =
; no feature selection for synthetic experiments — all features are used as-is
include_feature_selector = False
n_of_features = 10
; no feature type list needed for synthetic data
path_to_feature_types =
; same classifier suite as real-world experiments for comparability
classifiers_list = xgbclassifier randomforestclassifier extratreesclassifier logisticregression svc
; no shap or permutation importance for synthetic runs — saves compute
shap_analysis = False
perm_importance = False
; input_path and output_path are filled in by generate_synthetic_configs.py
; DO NOT edit these manually
input_path = {input_path}
output_path = {output_path}
; no patient dropping or baseline info handling for synthetic data
drop_random_patients = False
drop_bl_info = False
; calibration must stay True — H_tau requires calibrated probabilities
use_calibration = True
use_group_split = False
group_column =

[gridsearch params]
n_jobs = 16
refit = auprc
cv_repeats = 5
cv_splits = 3
n_iter = 20
; 0.2 consistent with real-world experiments
train_test_split_size = 0.2
; no imbalance handling — we want the natural imbalance to propagate
; so that tau is preserved in the model's learned threshold
handle_imb_data = no
; 30 iterations consistent with real-world experiments
nested_iterations = 30